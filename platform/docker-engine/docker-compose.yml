services:
  engine:
    build: ./backend
    ports:
      - "8000:8000"
      - "4210:4210/udp"
    environment:
      - DISCOVERY_HOSTNAME=${DISCOVERY_HOSTNAME:-trainer-engine}
      - EDGE_REQUIRED=true
      - MQTT_HOST=mqtt
      - MQTT_USERNAME=${MQTT_ENGINE_USERNAME:?Run tools/setup-mqtt-auth.ps1 first}
      - MQTT_PASSWORD=${MQTT_ENGINE_PASSWORD:?Run tools/setup-mqtt-auth.ps1 first}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:8080,http://127.0.0.1:8080}
      - USERS_DB_FILE=/data/users.json
      - EDGES_DB_FILE=/data/edges.json
    volumes:
      - ./backend/data:/data
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/instructor || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # MQTT broker for trainer communication
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt
    environment:
      - MQTT_HEALTHCHECK_USERNAME=${MQTT_ENGINE_USERNAME:?Run tools/setup-mqtt-auth.ps1 first}
      - MQTT_HEALTHCHECK_PASSWORD=${MQTT_ENGINE_PASSWORD:?Run tools/setup-mqtt-auth.ps1 first}
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h 127.0.0.1
          -u "$$MQTT_HEALTHCHECK_USERNAME"
          -P "$$MQTT_HEALTHCHECK_PASSWORD"
          -t '$$SYS/broker/version' -C 1 -W 5
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 5s
    restart: unless-stopped
