services:
  engine:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - EDGE_REQUIRED=true
      - MQTT_HOST=mqtt
      - USERS_DB_FILE=/data/users.json
      - EDGES_DB_FILE=/data/edges.json
    volumes:
      - ./backend/data:/data
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

  # MQTT broker for trainer communication
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    healthcheck:
      test:
        - CMD
        - mosquitto_sub
        - -h
        - 127.0.0.1
        - -t
        - "$$SYS/broker/version"
        - -C
        - "1"
        - -W
        - "5"
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 5s
    restart: unless-stopped
